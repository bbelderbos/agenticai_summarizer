[project]
name = "agenticai-summarizer"
version = "0.1.0"
description = "AI article/URL summarizer — a minimal text-to-structured-data demo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.101.0",
    "beautifulsoup4>=4.13.0",
    "cyclopts>=3.0.0",
    "python-decouple>=3.8",
    "requests>=2.33.1",
    "rich>=14.0.0",
    "sqlmodel>=0.0.37",
    "tenacity>=9.1.4",
]

[project.scripts]
summarizer = "summarizer.cli:app"
init-db = "summarizer.models:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "summarizer"

[dependency-groups]
dev = [
    "jg-lint>=0.5.0",
    "prek>=0.4.4",
    "pyrefly>=1.0.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
]

[tool.jg-linter]
select = ["MY001", "JG*"]
ignore = []
exclude = [".venv/**", "__pycache__/**", "*.egg-info/**", ".git/**", "target/**"]
